name: Weekly Database Backup

on:
  schedule:
    - cron: '0 6 * * 0'  # Sunday 06:00 UTC
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://iqgpbzvyyywflluqhpqj.supabase.co
    steps:
      - name: Install PostgreSQL 17 client (matches Supabase server version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          ls /usr/lib/postgresql/
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump database (compressed custom format)
        run: |
          # Call the v17 binary directly — the runner's preinstalled pg_dump 16
          # still wins on PATH even after installing postgresql-client-17.
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --schema=public \
            --file=backup.dump

      - name: Verify backup integrity
        run: |
          echo "File size:"
          ls -la backup.dump

          echo ""
          echo "Contents (table of contents):"
          /usr/lib/postgresql/17/bin/pg_restore --list backup.dump

          echo ""
          echo "Checking expected tables are present..."
          TOC=$(/usr/lib/postgresql/17/bin/pg_restore --list backup.dump)
          for TABLE in profiles sessions open_sessions; do
            if ! echo "$TOC" | grep -q "TABLE DATA public $TABLE "; then
              echo "MISSING: $TABLE — dump is incomplete or corrupt, aborting."
              exit 1
            fi
          done
          echo "All expected tables present. Backup looks valid."

      - name: Row counts (sanity check — compare against what you expect)
        run: |
          /usr/lib/postgresql/17/bin/psql "${{ secrets.SUPABASE_DB_URL }}" -c "
            SELECT 'profiles' AS table_name, COUNT(*) FROM profiles
            UNION ALL SELECT 'sessions', COUNT(*) FROM sessions
            UNION ALL SELECT 'open_sessions', COUNT(*) FROM open_sessions;
          "

      - name: Upload to Supabase Storage
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FILENAME="backup-$(date -u +%Y-%m-%d).dump"
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "$SUPABASE_URL/storage/v1/object/backups/$FILENAME" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @backup.dump)
          echo "HTTP status: $HTTP_STATUS"
          cat response.json
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "Upload failed"
            exit 1
          fi
          echo "Uploaded $FILENAME"
          # No rotation step by design — every backup is kept forever.
          # Compressed dumps of this DB are tiny (KBs), so decades of
          # weekly backups stay well under Supabase's free storage tier.
