name: Weekly Database Backup

on:
  schedule:
    # 02:30 UTC Monday = 23:30 Sunday in GMT-3 (Argentina/Chile/Uruguay)
    - cron: '30 2 * * 1'
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://iqgpbzvyyywflluqhpqj.supabase.co
    # Ephemeral throwaway Postgres, only used to prove the dump actually restores
    services:
      verify_db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verify_pw
          POSTGRES_DB: verify
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Compute backup path (organized by year)
        run: |
          DATE=$(date -u +%Y-%m-%d)
          YEAR=$(date -u +%Y)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "OBJECT_PATH=$YEAR/backup-$DATE.dump" >> "$GITHUB_ENV"

      - name: Install PostgreSQL 17 client (matches Supabase server version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump database (compressed custom format)
        run: |
          # Call the v17 binary directly — the runner's preinstalled pg_dump 16
          # still wins on PATH even after installing postgresql-client-17.
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --schema=public \
            --file=backup.dump
          echo "Dump file size:"
          ls -la backup.dump

      - name: Bootstrap Supabase-compatible schema in the throwaway DB
        env:
          PGPASSWORD: verify_pw
        run: |
          # Our dump references Supabase-managed objects (auth.uid(), and the
          # anon/authenticated roles used in RLS policies) that don't exist on
          # a plain postgres:17 image. Stub out just enough for the restore
          # to succeed structurally — this is only testing restorability and
          # row counts, not RLS behavior.
          cat > bootstrap.sql <<'SQL'
          DROP SCHEMA IF EXISTS public CASCADE;

          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated;
            END IF;
          END
          $$;

          CREATE SCHEMA IF NOT EXISTS auth;

          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $$ SELECT NULL::uuid $$;
          SQL

          /usr/lib/postgresql/17/bin/psql -h localhost -p 5433 -U postgres -d verify -f bootstrap.sql

      - name: Restore dump into the throwaway DB to prove it actually works
        env:
          PGPASSWORD: verify_pw
        run: |
          /usr/lib/postgresql/17/bin/pg_restore \
            --no-owner --no-privileges \
            -h localhost -p 5433 -U postgres -d verify \
            backup.dump

      - name: Verify row counts match exactly (source vs restored dump)
        env:
          PGPASSWORD: verify_pw
        run: |
          COUNT_SQL="SELECT 'profiles', COUNT(*) FROM profiles
            UNION ALL SELECT 'sessions', COUNT(*) FROM sessions
            UNION ALL SELECT 'open_sessions', COUNT(*) FROM open_sessions
            ORDER BY 1;"

          SOURCE_COUNTS=$(/usr/lib/postgresql/17/bin/psql "${{ secrets.SUPABASE_DB_URL }}" -t -A -c "$COUNT_SQL")
          RESTORED_COUNTS=$(/usr/lib/postgresql/17/bin/psql -h localhost -p 5433 -U postgres -d verify -t -A -c "$COUNT_SQL")

          echo "Live source DB:"
          echo "$SOURCE_COUNTS"
          echo ""
          echo "Restored from this backup:"
          echo "$RESTORED_COUNTS"

          {
            echo "SOURCE_COUNTS<<BACKUP_EOF"
            echo "$SOURCE_COUNTS"
            echo "BACKUP_EOF"
          } >> "$GITHUB_ENV"

          if [ "$SOURCE_COUNTS" != "$RESTORED_COUNTS" ]; then
            echo ""
            echo "MISMATCH — the backup does not restore to the same row counts as the live database."
            echo "Not uploading a backup that failed verification."
            exit 1
          fi
          echo ""
          echo "Row counts match exactly. Backup is verified good — restorable and complete."

      - name: Upload to Supabase Storage
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "$SUPABASE_URL/storage/v1/object/backups/$OBJECT_PATH" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @backup.dump)
          echo "HTTP status: $HTTP_STATUS"
          cat response.json
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "Upload failed"
            exit 1
          fi
          echo "Uploaded $OBJECT_PATH (verified good before upload)"
          # No rotation step by design — every dated backup is kept forever.
          # Compressed dumps of this DB are tiny (KBs), so decades of
          # weekly backups stay well under Supabase's free storage tier.

      # Always-current status file at a fixed path — check this one file
      # any time instead of digging through run history.
      - name: Write success status marker
        if: success()
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          {
            echo "OK"
            echo "date: $DATE"
            echo "file: $OBJECT_PATH"
            echo "row_counts:"
            echo "$SOURCE_COUNTS"
          } > status.txt
          curl -s -X POST \
            "$SUPABASE_URL/storage/v1/object/backups/_status/last-run.txt" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: text/plain" \
            -H "x-upsert: true" \
            --data-binary @status.txt

      - name: Write failure status marker
        if: failure()
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          {
            echo "FAILED"
            echo "date: $DATE"
            echo "run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > status.txt
          curl -s -X POST \
            "$SUPABASE_URL/storage/v1/object/backups/_status/last-run.txt" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: text/plain" \
            -H "x-upsert: true" \
            --data-binary @status.txt || true
