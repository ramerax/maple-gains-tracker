name: Weekly Database Backup

on:
  schedule:
    - cron: '0 6 * * 0'  # Sunday 06:00 UTC
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://iqgpbzvyyywflluqhpqj.supabase.co
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dump database (compressed custom format)
        run: |
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --schema=public \
            --file=backup.dump

      - name: Upload to Supabase Storage
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FILENAME="backup-$(date -u +%Y-%m-%d).dump"
          curl -sf -X POST \
            "$SUPABASE_URL/storage/v1/object/backups/$FILENAME" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @backup.dump
          echo "Uploaded $FILENAME"

      - name: Rotate old backups (keep last 8 weeks)
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sf -X POST \
            "$SUPABASE_URL/storage/v1/object/list/backups" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"limit": 1000, "sortBy": {"column": "name", "order": "asc"}}' \
            -o list.json

          TO_DELETE=$(jq -c '[.[].name] | sort | .[:-8]' list.json)
          echo "Deleting: $TO_DELETE"

          if [ "$TO_DELETE" != "[]" ]; then
            curl -sf -X DELETE \
              "$SUPABASE_URL/storage/v1/object/backups" \
              -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"prefixes\": $TO_DELETE}"
          fi
