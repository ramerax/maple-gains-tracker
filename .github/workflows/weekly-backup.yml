name: Weekly Database Backup

on:
  schedule:
    - cron: '0 6 * * 0'  # Sunday 06:00 UTC
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://iqgpbzvyyywflluqhpqj.supabase.co
    # Ephemeral throwaway Postgres, only used to prove the dump actually restores
    services:
      verify_db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verify_pw
          POSTGRES_DB: verify
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Install PostgreSQL 17 client (matches Supabase server version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump database (compressed custom format)
        run: |
          # Call the v17 binary directly — the runner's preinstalled pg_dump 16
          # still wins on PATH even after installing postgresql-client-17.
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --schema=public \
            --file=backup.dump
          echo "Dump file size:"
          ls -la backup.dump

      - name: Restore dump into a throwaway DB to prove it actually works
        env:
          PGPASSWORD: verify_pw
        run: |
          /usr/lib/postgresql/17/bin/pg_restore \
            --no-owner --no-privileges \
            -h localhost -p 5433 -U postgres -d verify \
            backup.dump

      - name: Verify row counts match exactly (source vs restored dump)
        env:
          PGPASSWORD: verify_pw
        run: |
          COUNT_SQL="SELECT 'profiles', COUNT(*) FROM profiles
            UNION ALL SELECT 'sessions', COUNT(*) FROM sessions
            UNION ALL SELECT 'open_sessions', COUNT(*) FROM open_sessions
            ORDER BY 1;"

          SOURCE_COUNTS=$(/usr/lib/postgresql/17/bin/psql "${{ secrets.SUPABASE_DB_URL }}" -t -A -c "$COUNT_SQL")
          RESTORED_COUNTS=$(/usr/lib/postgresql/17/bin/psql -h localhost -p 5433 -U postgres -d verify -t -A -c "$COUNT_SQL")

          echo "Live source DB:"
          echo "$SOURCE_COUNTS"
          echo ""
          echo "Restored from this backup:"
          echo "$RESTORED_COUNTS"

          if [ "$SOURCE_COUNTS" != "$RESTORED_COUNTS" ]; then
            echo ""
            echo "MISMATCH — the backup does not restore to the same row counts as the live database."
            echo "Not uploading a backup that failed verification."
            exit 1
          fi
          echo ""
          echo "Row counts match exactly. Backup is verified good — restorable and complete."

      - name: Upload to Supabase Storage
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FILENAME="backup-$(date -u +%Y-%m-%d).dump"
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "$SUPABASE_URL/storage/v1/object/backups/$FILENAME" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @backup.dump)
          echo "HTTP status: $HTTP_STATUS"
          cat response.json
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "Upload failed"
            exit 1
          fi
          echo "Uploaded $FILENAME (verified good before upload)"
          # No rotation step by design — every backup is kept forever.
          # Compressed dumps of this DB are tiny (KBs), so decades of
          # weekly backups stay well under Supabase's free storage tier.
